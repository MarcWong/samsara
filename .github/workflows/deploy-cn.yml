name: Deploy mandarin branch to samsara_cn

on:
  push:
    branches: [mandarin]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # package-lock.json isn't committed, so no cache. --legacy-peer-deps
        # because a fresh peer-dependency resolve currently crashes npm 10
        # ("Cannot read properties of null (reading 'edgesOut')").
        run: npm install --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        # The Chinese site lives at marcwong.github.io/samsara_cn, so every
        # asset path needs that prefix. No Supabase vars on purpose: this
        # copy does not report runs.
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /samsara_cn

      - name: Deploy to samsara_cn
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Deploy key scoped to samsara_cn only (write access).
          deploy_key: ${{ secrets.SAMSARA_CN_DEPLOY_KEY }}
          external_repository: MarcWong/samsara_cn
          publish_branch: gh-pages
          publish_dir: build
