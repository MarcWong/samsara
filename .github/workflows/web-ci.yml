name: web CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # package-lock.json isn't committed, so there's no lockfile to run
        # `npm ci` or cache against.
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
