name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4  # 🔼 升级到 v4

    - name: Set up Node.js
      uses: actions/setup-node@v4  # 🔼 升级到 v4
      with:
        node-version: '20'       # 💡 建议升级到 20 (Node 18 已临近生命周期末期，且 20 是当前的主流 LTS 版本)

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build the project
      run: pnpm build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3  # ✅ 保持 v3 不变
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public